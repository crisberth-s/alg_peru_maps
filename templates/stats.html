<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estadísticas - Perú Route Lab</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      background: #0e1420;
      color: #e2e8f0;
      font-family: 'DM Sans', sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-family: 'Space Mono', monospace;
      color: #3b82f6;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .chart-container {
      background: #141c2e;
      border-radius: 10px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.07);
    }
    canvas {
      width: 100%;
      height: 300px;
    }
    .loading {
      text-align: center;
      grid-column: span 2;
      padding: 40px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <h1>📊 Estadísticas de Algoritmos</h1>
  <div class="grid" id="charts-grid">
    <div class="chart-container">
      <canvas id="distChart"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="timeChart"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="nodesChart"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="effChart"></canvas>
    </div>
  </div>

  <script>
    (async function() {
      const resp = await fetch('/api/stats');
      const allData = await resp.json();
      if (!allData.length) {
        document.getElementById('charts-grid').innerHTML = '<div class="loading">No hay datos aún. Realiza algunas comparaciones primero.</div>';
        return;
      }

      // Acumular métricas por algoritmo
      const metrics = {};  // { algo: { distancias: [], tiempos: [], nodos: [], exitos: 0, total: 0 } }
      allData.forEach(entry => {
        for (const algo in entry.algoritmos) {
          const res = entry.algoritmos[algo];
          if (!metrics[algo]) metrics[algo] = { distancias: [], tiempos: [], nodos: [], exitos: 0, total: 0 };
          metrics[algo].total++;
          if (!res.error) {
            if (res.distance_km != null) metrics[algo].distancias.push(res.distance_km);
            if (res.time != null) metrics[algo].tiempos.push(res.time);
            if (res.nodes_visited != null) metrics[algo].nodos.push(res.nodes_visited);
            metrics[algo].exitos++;
          }
        }
      });

      const algorithms = Object.keys(metrics);
      const colors = [
        '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6',
        '#ec4899', '#06b6d4', '#ef4444'
      ];

      function average(arr) {
        if (!arr.length) return 0;
        return arr.reduce((a,b) => a+b, 0) / arr.length;
      }

      // 1. Distancia promedio
      new Chart(document.getElementById('distChart'), {
        type: 'bar',
        data: {
          labels: algorithms,
          datasets: [{
            label: 'Distancia promedio (km)',
            data: algorithms.map(a => average(metrics[a].distancias)),
            backgroundColor: colors.slice(0, algorithms.length),
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false }, title: { display: true, text: 'Distancia promedio' } }
        }
      });

      // 2. Tiempo promedio
      new Chart(document.getElementById('timeChart'), {
        type: 'bar',
        data: {
          labels: algorithms,
          datasets: [{
            label: 'Tiempo promedio (s)',
            data: algorithms.map(a => average(metrics[a].tiempos)),
            backgroundColor: colors.slice(0, algorithms.length),
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false }, title: { display: true, text: 'Tiempo de ejecución promedio' } }
        }
      });

      // 3. Nodos visitados promedio
      new Chart(document.getElementById('nodesChart'), {
        type: 'bar',
        data: {
          labels: algorithms,
          datasets: [{
            label: 'Nodos visitados promedio',
            data: algorithms.map(a => average(metrics[a].nodos)),
            backgroundColor: colors.slice(0, algorithms.length),
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false }, title: { display: true, text: 'Nodos visitados promedio' } }
        }
      });

      // 4. Eficiencia (% de rutas exitosas)
      new Chart(document.getElementById('effChart'), {
        type: 'bar',
        data: {
          labels: algorithms,
          datasets: [{
            label: 'Eficiencia (%)',
            data: algorithms.map(a => (metrics[a].exitos / metrics[a].total * 100) || 0),
            backgroundColor: colors.slice(0, algorithms.length),
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false }, title: { display: true, text: 'Eficiencia (% de rutas encontradas)' } },
          scales: { y: { max: 100, min: 0 } }
        }
      });
    })();
  </script>
</body>
</html>
